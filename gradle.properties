org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Djavax.net.ssl.trustStore=/home/hatch/android-truststore.jks -Djavax.net.ssl.trustStorePassword=changeit
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 依赖下载走出口代理（Gradle 的 user.home 是 /root，~/.gradle/gradle.properties
# 不会被读取，故代理与信任库配置必须写在工程级 gradle.properties 里才生效）。
systemProp.http.proxyHost=hatch-egress-proxy
systemProp.http.proxyPort=3128
systemProp.https.proxyHost=hatch-egress-proxy
systemProp.https.proxyPort=3128
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
